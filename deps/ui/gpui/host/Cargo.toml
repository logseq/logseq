[package]
name = "logseq-gpui"
version = "0.1.0"
edition = "2021"
description = "Logseq deps/ui GPUI host — embeds the OCaml LUI app in a gpui-kit window"
publish = false

[dependencies]
flume = "0.12"
# `log` facade backend — gpui/wgpu diagnostics (device pick, surface,
# present errors) are invisible without one; RUST_LOG=off silences it.
env_logger = "0.11"
# Sibling checkout convention: ../lui path dep.
# the logseq and lui repos live side by side. Override at build time with
# LUI_GPUI_CRATE_DIR / LUI_CORE_CRATE_DIR via build.rs path substitution if
# your layout differs.
lui-gpui = { path = "../../../../../lui/platform/gpui/crates/lui-gpui" }
lui-core = { path = "../../../../../lui/platform/gpui/crates/lui-core" }
# tree-sitter-languages powers the logseq-codemirror editor highlight.
gpui-kit = { version = "0.7", features = ["tree-sitter-languages"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Event-driven OCaml pump: wakeup callbacks post into an async channel
# the UI loop awaits instead of polling on a fixed timer.
libc = "0.2"
# LaTeX -> typst -> SVG for the logseq-katex math slots.
typst = "0.15"
typst-svg = "0.15"
typst-layout = "0.15"
typst-kit = { version = "0.15", features = ["embedded-fonts"] }
# Pure-Rust PDF rasterizer for logseq-pdf.
hayro = "0.8"
hayro-syntax = "0.8"
image = "0.25"

# Native webview overlay for logseq-iframe embeds (video/tweet/hiccup
# iframes): lb-wry is the engine behind upstream's `gpui-webview`
# (`gpui-wry` on crates.io) — WKWebView on macOS, WebView2 on Windows,
# WebKitGTK inside a reparented X11 child window on Linux. Other
# platforms keep the placeholder chip.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "0.53.3", package = "lb-wry" }

[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.53.3", package = "lb-wry" }
# gtk::init / main_iteration pump / widget scale_factor for the
# WebKitGTK embeds (same gtk release wry links).
gtk = "0.18"

[dev-dependencies]
# test-support exposes TestAppContext/#[gpui_kit::test] for the headless
# smoke test in src/main.rs
gpui-kit = { version = "0.7", features = ["test-support"] }

[build-dependencies]
serde_json = "1"

# taffy 0.13 cache-slot thrash causes exponential relayout on deep flex
# trees (a single draw ran 15.8M compute_flexbox_layout calls on ~1.5k
# nodes). The logseq/taffy fork is taffy 0.13.0 + the fix in
# src/tree/cache.rs: unbounded measure_entries so distinct
# (known_dimensions, available_space, parent_size) combos no longer
# collide on 9 slots. layout drops 4.2s -> ~18ms.
[patch.crates-io]
taffy = { git = "https://github.com/logseq/taffy", tag = "v0.13.0-logseq.1" }

# Layout is instantiated inside GPUI. Keep the rendering path optimized
# in development builds so interactive profiling reflects usable frame times.
[profile.dev.package.logseq-gpui]
opt-level = 1

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-base]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.lui-gpui]
opt-level = 3

# These are runtime calls across crate boundaries, not only generic code
# instantiated in GPUI: flex layout, wire property reads, and element IDs.
[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.lui-core]
opt-level = 3

[profile.dev.package.smol_str]
opt-level = 3

[profile.dev.package.slotmap]
opt-level = 3

[profile.dev.package.rustc-hash]
opt-level = 3

[profile.dev.package.refineable]
opt-level = 3
