[package]
name = "nsh-app-logseq"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { git = "https://github.com/logseq/nsh", rev = "adc186db7213f3ccd1eacaa836cc721e9779fd14" }
nsh-base = { git = "https://github.com/logseq/nsh", rev = "adc186db7213f3ccd1eacaa836cc721e9779fd14", default-features = false, features = ["editor", "highlight"] }
lui-nsh = { path = "../../../../lui/platform/nsh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
url = "2"
env_logger = "0.11"
arboard = { version = "=3.6.1", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
interim = { version = "=0.2.2", default-features = false, features = ["chrono_0_4"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
nsh-platform-linux = { git = "https://github.com/logseq/nsh", rev = "adc186db7213f3ccd1eacaa836cc721e9779fd14", default-features = false, features = ["editor", "highlight"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-pdf-kit = { version = "=0.3.2", default-features = false, features = ["std", "PDFDocument", "PDFPage", "PDFView", "PDFSelection", "PDFAnnotation", "PDFAnnotationUtilities", "PDFBorder", "objc2-app-kit", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSUUID"] }
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
nsh-platform-macos = { git = "https://github.com/logseq/nsh", rev = "adc186db7213f3ccd1eacaa836cc721e9779fd14", default-features = false, features = ["editor", "highlight"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
nsh-platform-windows = { git = "https://github.com/logseq/nsh", rev = "adc186db7213f3ccd1eacaa836cc721e9779fd14", default-features = false, features = ["editor", "highlight"] }

[dev-dependencies]
ureq = "=3.5.1"
nsh-engine = { git = "https://github.com/logseq/nsh", rev = "adc186db7213f3ccd1eacaa836cc721e9779fd14", default-features = false }
nsh-testing = { git = "https://github.com/logseq/nsh", rev = "adc186db7213f3ccd1eacaa836cc721e9779fd14", default-features = false }
