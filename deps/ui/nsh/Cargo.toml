[package]
name = "nsh-app-logseq"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { git = "https://github.com/logseq/nsh", rev = "bfa15d0c843c0d6f5bf3a2a230e8ca56b876b61c" }
nsh-base = { git = "https://github.com/logseq/nsh", rev = "bfa15d0c843c0d6f5bf3a2a230e8ca56b876b61c", default-features = false, features = ["editor", "highlight"] }
lui-nsh = { path = "../../../../lui/platform/nsh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
env_logger = "0.11"
arboard = { version = "=3.6.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
nsh-platform-linux = { git = "https://github.com/logseq/nsh", rev = "bfa15d0c843c0d6f5bf3a2a230e8ca56b876b61c", default-features = false, features = ["editor", "highlight"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
nsh-platform-macos = { git = "https://github.com/logseq/nsh", rev = "bfa15d0c843c0d6f5bf3a2a230e8ca56b876b61c", default-features = false, features = ["editor", "highlight"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
nsh-platform-windows = { git = "https://github.com/logseq/nsh", rev = "bfa15d0c843c0d6f5bf3a2a230e8ca56b876b61c", default-features = false, features = ["editor", "highlight"] }

[dev-dependencies]
ureq = "=3.5.1"
nsh-engine = { git = "https://github.com/logseq/nsh", rev = "bfa15d0c843c0d6f5bf3a2a230e8ca56b876b61c", default-features = false }
nsh-testing = { git = "https://github.com/logseq/nsh", rev = "bfa15d0c843c0d6f5bf3a2a230e8ca56b876b61c", default-features = false }
