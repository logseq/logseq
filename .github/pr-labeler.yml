# actions/labeler (v5+) format: regexps matched against the pull request's head branch name.
':type/feature':
  - head-branch: ['^feature/', '^feat/', ':feat/']
':type/enhancement':
  - head-branch: ['^enhancement/', '^enh/', '^enhance/', '^improve/', ':enhance/']
':type/bug-fix':
  - head-branch: ['^fix', '^bug/', '^bug-fix/', '^bugfix/', '^bug-fixes/', '^bugfixes/', ':fix/']
':type/dev':
  - head-branch: ['^chore/', '^test/', '^docs/', '^build/', '^ci/', '^misc/', '^dev/', ':dev/', ':chore/', ':test/']
