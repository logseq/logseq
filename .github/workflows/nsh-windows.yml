name: Actual Logseq NSH Windows

on:
  push:
    branches: ['refactor/lui']
  pull_request:
    branches: ['refactor/lui']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logseq-nsh-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LUI_REF: 961107c7c071b04551587b39cc7cdd16f738c07a
  RUSTUP_TOOLCHAIN: 1.97.0
  CARGO_BUILD_JOBS: 2
  RUST_MIN_STACK: 268435456
  PYTHONUTF8: 1

jobs:
  native-application:
    name: Actual Windows App, private worker and native HANDLE boundary
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5.1'
          windows-compiler: mingw
          windows-environment: cygwin
          dune-cache: true
      - name: Select the active native OCaml switch
        run: |
          $switch = opam switch show
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the native OCaml switch' }
          "OPAMSWITCH=$switch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Checkout the exact LUI application provider beside Logseq
        run: |
          $lui = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'lui'
          git clone --no-checkout https://github.com/logseq/lui.git $lui
          if ($LASTEXITCODE -ne 0) { throw 'LUI checkout failed' }
          git -C $lui checkout --detach $env:LUI_REF
          if ($LASTEXITCODE -ne 0) { throw 'Immutable LUI revision checkout failed' }
          $actual = git -C $lui rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:LUI_REF) { throw 'LUI source revision mismatch' }
          "LUI_SOURCE=$lui" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LUI_SOURCE_ROOT=$lui" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Initialize supported VS 2022 before locked Node native addons compile.
      # Pin the actual linker before opam adds Cygwin programs to PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - name: Pin the Visual C++ linker before opam changes PATH
        run: |
          if (!$env:VCToolsInstallDir) { throw 'MSVC did not provide VCToolsInstallDir' }
          $msvcBin = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64'
          $linker = (Resolve-Path (Join-Path $msvcBin 'link.exe') -ErrorAction Stop).Path
          $dumpbin = (Resolve-Path (Join-Path $msvcBin 'dumpbin.exe') -ErrorAction Stop).Path
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NSH_DUMPBIN=$dumpbin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Root stylesheet and native generator dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
      - name: Locked UI-local JavaScript dependencies
        run: npm ci --prefix deps/ui --ignore-scripts
      - name: Install the existing actual worker and UI OCaml dependencies
        shell: bash
        run: |
          (cd deps/db-worker && sh scripts/install-opam-deps.sh)
          (cd deps/ui && sh scripts/install-opam-deps.sh)
      - name: Install the pinned native Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Resolve explicit native toolchain and redistributable roots
        run: |
          New-Item -ItemType Directory -Force _build/nsh-ci | Out-Null
          $dumpbin = (Resolve-Path $env:NSH_DUMPBIN -ErrorAction Stop).Path
          $linker = (Resolve-Path $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER -ErrorAction Stop).Path
          $opamRoot = opam var root
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the opam root' }
          $switchBin = opam var bin
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the opam switch bin directory' }
          $ocamlLibrary = opam exec -- ocamlc -where
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the OCaml runtime directory' }
          $mingw = Join-Path $opamRoot '.cygwin/root/usr/x86_64-w64-mingw32/sys-root/mingw/bin'
          if (!(Test-Path $mingw -PathType Container)) { throw "Missing existing worker MinGW sysroot: $mingw" }
          if (!$env:VCToolsRedistDir) { throw 'MSVC did not provide VCToolsRedistDir' }
          $crt = @(Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64') -Directory -Filter 'Microsoft.VC*.CRT')
          if ($crt.Count -ne 1) { throw 'Expected exactly one active x64 Visual C++ CRT directory' }
          $roots = @($mingw, $switchBin, $ocamlLibrary, $crt[0].FullName) |
            ForEach-Object { (Resolve-Path $_ -ErrorAction Stop).Path } | Select-Object -Unique
          @{
            dumpbin = $dumpbin
            linker = $linker
            dllRoots = @($roots)
            lui = $env:LUI_REF
            logseq = (git rev-parse HEAD)
          } | ConvertTo-Json | Set-Content _build/nsh-ci/windows-toolchain.json -Encoding utf8
          "NSH_DUMPBIN=$dumpbin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          opam exec -- ocamlopt -config | Set-Content _build/nsh-ci/ocaml-config.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Native OCaml configuration failed' }
      - name: Source and publication plumbing regressions
        run: |
          python -m unittest discover -s deps/ui/nsh -p 'test_windows*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Windows build source regressions failed' }
          node --test --test-name-pattern="Windows receipt" deps/ui/nsh/build_publication_test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Application publication regressions failed' }
          node --test --test-name-pattern="Windows" deps/ui/scripts/package-nsh.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows package ownership regressions failed' }
      - name: Native worker HANDLE ownership, OS pid and error codes
        run: |
          $handleLog = Join-Path $env:GITHUB_WORKSPACE '_build/nsh-ci/windows-handles.log'
          $fixture = Join-Path $env:RUNNER_TEMP 'logseq-nsh-worker-handles'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          Copy-Item deps/ui/native/logseq_lui_bridge.c $fixture
          Copy-Item deps/ui/nsh/tests/fixtures/windows_worker_handles.ml $fixture
          Push-Location $fixture
          try {
            opam exec -- ocamlfind ocamlopt -thread -package 'unix,threads.posix' -linkpkg `
              logseq_lui_bridge.c windows_worker_handles.ml -o worker-handles.exe
            if ($LASTEXITCODE -ne 0) { throw 'Actual Windows HANDLE fixture compilation failed' }
            & .\worker-handles.exe 2>&1 | Tee-Object $handleLog
            if ($LASTEXITCODE -ne 0) { throw 'Actual Windows HANDLE fixture failed' }
          } finally { Pop-Location }
      - name: Native Windows Host timer module and nonblocking wake channel
        run: |
          $timerLog = Join-Path $env:GITHUB_WORKSPACE '_build/nsh-ci/windows-host-timers.log'
          $fixture = Join-Path $env:RUNNER_TEMP 'logseq-nsh-host-timers'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          Copy-Item deps/ui/src/contracts/ui_task.ml $fixture
          Copy-Item deps/ui/src/contracts/ui_task.mli $fixture
          Copy-Item deps/ui/native/services/host.ml $fixture
          Copy-Item deps/ui/nsh/tests/fixtures/windows_host_timers.ml $fixture
          Push-Location $fixture
          try {
            opam exec -- ocamlfind ocamlopt -thread -package 'unix,threads.posix,ocaml-signal,mtime.clock.os' -linkpkg `
              ui_task.mli ui_task.ml host.ml windows_host_timers.ml -o host-timers.exe
            if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Host timer fixture compilation failed' }
            $probe = Start-Process -FilePath (Join-Path $fixture 'host-timers.exe') -PassThru -NoNewWindow `
              -RedirectStandardOutput $timerLog -RedirectStandardError "$timerLog.stderr"
            if (-not $probe.WaitForExit(15000)) {
              $probe.Kill()
              throw 'Actual Windows Host timer fixture did not finish in 15 seconds'
            }
            Get-Content $timerLog
            if (Test-Path "$timerLog.stderr") { Get-Content "$timerLog.stderr" }
            if ($probe.ExitCode -ne 0) { throw 'Actual Windows Host timer fixture failed' }
          } finally { Pop-Location }
      - name: Actual application formatting, strict compiler and host tests
        run: |
          cargo fmt --manifest-path deps/ui/nsh/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Application formatting failed' }
          cargo clippy --locked --manifest-path deps/ui/nsh/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Strict actual application compilation failed' }
          cargo test --locked --manifest-path deps/ui/nsh/Cargo.toml --lib --bin nsh-app-logseq
          if ($LASTEXITCODE -ne 0) { throw 'Actual application host/factory tests failed' }
      - name: Portable PDF fixture and pinned-artifact source guards
        run: |
          python -m unittest discover -s deps/ui/nsh -p 'test_prepare_pdf*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Private PDF fixture/artifact source guards failed' }
      - name: Actual Win32 PDF window ownership regressions
        run: |
          New-Item -ItemType Directory -Force _build/nsh-ci/pdfium | Out-Null
          cargo test --locked --manifest-path deps/ui/nsh/Cargo.toml --example pdfium_engine_probe -- --test-threads=1 `
            2>&1 | Tee-Object _build/nsh-ci/pdfium/native-widget-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF window/provider qualification failed' }
      - name: Load the pinned PDFium artifact and qualify its owned document worker
        run: |
          $privatePdf = Join-Path $env:RUNNER_TEMP ('logseq-pdf-qualification-' + [guid]::NewGuid())
          New-Item -ItemType Directory $privatePdf -ErrorAction Stop | Out-Null
          $engine = Join-Path $privatePdf 'engine'
          $fixture = Join-Path $privatePdf 'fixture'
          python deps/ui/nsh/prepare_pdfium.py --target win-x64 --output $engine `
            > _build/nsh-ci/pdfium/preparation.json
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PDFium artifact preparation failed' }
          Copy-Item (Join-Path $engine 'receipt.json') _build/nsh-ci/pdfium/engine-receipt.json
          Copy-Item (Join-Path $engine 'LICENSE') _build/nsh-ci/pdfium/
          Copy-Item (Join-Path $engine 'args.gn') _build/nsh-ci/pdfium/
          Copy-Item -Recurse (Join-Path $engine 'licenses') _build/nsh-ci/pdfium/
          python deps/ui/nsh/prepare_pdf_probe.py --output $fixture > _build/nsh-ci/pdfium/fixture-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'Private authored PDF generation failed' }
          cargo run --locked --manifest-path deps/ui/nsh/Cargo.toml --example pdfium_engine_probe -- `
            (Join-Path $engine 'pdfium.dll') (Join-Path $fixture 'original.pdf') 'Original page one' `
            > _build/nsh-ci/pdfium/engine-probe.json 2> _build/nsh-ci/pdfium/engine-probe.stderr.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual PDFium load/document/owned-worker qualification failed' }
      - name: Build the actual DLL, schemas, worker and clean-PATH private App gate
        run: |
          $tools = Get-Content _build/nsh-ci/windows-toolchain.json -Raw | ConvertFrom-Json
          $arguments = @('deps/ui/nsh/build_windows.py', '--lui-source', $env:LUI_SOURCE_ROOT,
            '--dumpbin', $env:NSH_DUMPBIN)
          foreach ($root in $tools.dllRoots) { $arguments += @('--dll-root', $root) }
          & python @arguments 2>&1 | Tee-Object _build/nsh-ci/build-windows.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows application build/private startup qualification failed' }
          $binary = Join-Path $env:GITHUB_WORKSPACE 'deps/ui/_build/nsh-windows/logseq-nsh.exe'
          node "$env:LUI_SOURCE_ROOT/tooling/lui_build_receipt.mjs" check --artifact $binary
          if ($LASTEXITCODE -ne 0) { throw 'Qualified Windows application receipt is stale' }
          Copy-Item "$binary.lui-build.json" _build/nsh-ci/actual-app.lui-build.json
          Copy-Item deps/ui/_build/nsh-windows/Resources/windows-dependencies.json _build/nsh-ci/
      - name: Real native save cancellation and production bounded row contracts
        run: |
          $contractsLog = Join-Path $env:GITHUB_WORKSPACE '_build/nsh-ci/activity-contracts.log'
          python -m unittest discover -s deps/ui/scripts -p 'test_prepare_melange_runtime.py'
          if ($LASTEXITCODE -ne 0) { throw 'Melange runtime metadata regressions failed' }
          $runtime = python deps/ui/scripts/prepare-melange-runtime.py _build/nsh-ci/melange-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Matching Melange CommonJS runtime generation failed' }
          $env:NODE_PATH = $runtime
          Push-Location deps/ui
          try {
            opam exec -- dune runtest test/contracts 2>&1 | Tee-Object $contractsLog
            if ($LASTEXITCODE -ne 0) { throw 'Actual cross-platform task/service contract tests failed' }
          } finally { Pop-Location }
          opam exec -- python deps/ui/nsh/run_update_preparation_native.py 2>&1 | Tee-Object _build/nsh-ci/save-abort-contracts.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual native save cancellation contract failed' }
          opam exec -- python deps/ui/nsh/run_owned_worker_update_native.py `
            --worker deps/db-worker/_build/default/bin/main.exe `
            2>&1 | Tee-Object _build/nsh-ci/owned-worker-update.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual owned-worker update shutdown and durability contract failed' }
          opam exec -- python deps/ui/nsh/run_virtual_rows_native.py 2>&1 | Tee-Object _build/nsh-ci/production-virtual-rows.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual native bounded row contract failed' }
      - name: Package the actual Windows App ZIP and unsigned Inno installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc -PathType Leaf)) { throw 'The runner must provide its documented Inno Setup 6 compiler' }
          python deps/ui/nsh/package_windows.py --lui-source $env:LUI_SOURCE_ROOT --iscc $iscc `
            --output _build/nsh-ci/packages 2>&1 | Tee-Object _build/nsh-ci/package-windows.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows ZIP/installer packaging failed' }
          $archives = @(Get-ChildItem _build/nsh-ci/packages -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one actual Windows update archive' }
          node deps/ui/scripts/package-nsh.mjs check-release-windows $archives[0].FullName $env:LUI_SOURCE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Final Windows archive/installer/sidecar receipt failed' }
      - name: Compile real worker admission and exercise the actual Inno installer
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'logseq-nsh-installation-admission'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          Copy-Item deps/db-worker/runtime/native/node_process_stubs.c $fixture
          Copy-Item deps/ui/nsh/tests/fixtures/windows_installation.ml $fixture
          Push-Location $fixture
          try {
            opam exec -- ocamlfind ocamlopt -thread -package 'unix,threads.posix' -linkpkg `
              node_process_stubs.c windows_installation.ml -o installation-fixture.exe
            if ($LASTEXITCODE -ne 0) { throw 'Real native worker admission fixture compilation failed' }
          } finally { Pop-Location }
          $archives = @(Get-ChildItem _build/nsh-ci/packages -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one actual installer/ZIP release' }
          $tools = Get-Content _build/nsh-ci/windows-toolchain.json -Raw | ConvertFrom-Json
          $arguments = @('deps/ui/nsh/qualify_windows_installer.py', '--archive', $archives[0].FullName,
            '--fixture', (Join-Path $fixture 'installation-fixture.exe'),
            '--evidence', '_build/nsh-ci/installer-admission', '--dumpbin', $tools.dumpbin)
          foreach ($root in $tools.dllRoots) { $arguments += @('--dll-root', $root) }
          python @arguments 2>&1 | Tee-Object _build/nsh-ci/installer-admission-driver.log
          if ($LASTEXITCODE -ne 0) { throw 'Actual Inno admission/install/refusal/repair qualification failed' }
      - name: Preserve actual Windows build and startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-logseq-nsh-windows
          path: _build/nsh-ci/
          if-no-files-found: warn
