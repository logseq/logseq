name: refactor/lui CI

on:
  push:
    branches: ['refactor/lui']
  pull_request:
    branches: ['refactor/lui']
  workflow_dispatch:

concurrency:
  group: refactor-lui-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  OCAML_VERSION: '5.5.1'

jobs:
  ubuntu:
    name: Build & test (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libffi-dev libgmp-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            deps/db-worker/pnpm-lock.yaml
            deps/ui/pnpm-lock.yaml
            libs/pnpm-lock.yaml

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          dune-cache: true

      - name: Checkout lui at pinned revision
        id: lui
        run: |
          lui_ref=$(sed -n 's/.*lui\.git#\([0-9a-f]\{40\}\).*/\1/p' deps/ui/scripts/install-opam-deps.sh | head -1)
          test -n "$lui_ref"
          git clone --no-checkout https://github.com/logseq/lui.git "$RUNNER_TEMP/lui"
          git -C "$RUNNER_TEMP/lui" checkout "$lui_ref"
          echo "commit=$(git -C "$RUNNER_TEMP/lui" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "LUI_SOURCE=$RUNNER_TEMP/lui" >> "$GITHUB_ENV"

      - name: Restore opam switch cache
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.opam
            _opam
          key: ${{ runner.os }}-opam-rlui-${{ env.OCAML_VERSION }}-${{ steps.lui.outputs.commit }}-${{ hashFiles('deps/db-worker/scripts/install-opam-deps.sh', 'deps/db-worker/dune-project', 'deps/ui/scripts/install-opam-deps.sh', 'deps/ui/dune-project') }}
          restore-keys: |
            ${{ runner.os }}-opam-rlui-${{ env.OCAML_VERSION }}-

      - name: Root pnpm deps
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      - name: opam deps (db-worker + ui)
        run: |
          (cd deps/db-worker && sh scripts/install-opam-deps.sh)
          (cd deps/ui && sh scripts/install-opam-deps.sh)
          opam install -y uri
          opam list --pinned

      - name: Save opam switch cache
        uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.opam
            _opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: JS deps (db-worker, ui, SDK)
        # package-lock.json is out of sync with package.json; pnpm lock works
        run: |
          pnpm --dir deps/db-worker install --ignore-workspace --frozen-lockfile
          pnpm --dir deps/ui install --ignore-workspace --frozen-lockfile
          pnpm --dir libs install --ignore-workspace --frozen-lockfile

      - name: Build deps/db-worker
        working-directory: deps/db-worker
        run: opam exec -- dune build

      - name: Configure Linux OCaml shared-object linking
        run: |
          system_archive=$(cc -print-file-name=librt.a)
          test -f "$system_archive"
          echo "OCAMLPARAM=_,cclib=-L$(dirname "$system_archive")" >> "$GITHUB_ENV"

      - name: Build deps/ui
        working-directory: deps/ui
        run: opam exec -- dune build

      - name: UI tests (test_main.js)
        working-directory: deps/ui
        run: node _build/default/test/ui_test/test/test_main.js

      - name: dune runtest (deps/ui)
        working-directory: deps/ui
        run: opam exec -- dune runtest

      - name: db-worker bundle
        run: pnpm db-worker:build

      - name: QuickJS SDK contract
        run: |
          (cd libs && pnpm exec tsc --ignoreConfig --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022 src/LSPlugin.quickjs.ts src/LSPlugin.quickjs-entry.ts)
          sh deps/ui/scripts/check-quickjs-sdk.sh

      - name: Web bundle (vite)
        run: pnpm ui:build

      - name: CSS build
        run: pnpm gulp:build

  macos:
    name: Apple host build (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: System deps
        run: brew install pkg-config gmp libffi dylibbundler

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            deps/db-worker/pnpm-lock.yaml
            deps/ui/pnpm-lock.yaml
            libs/pnpm-lock.yaml

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          dune-cache: true

      - name: Checkout lui at pinned revision
        id: lui
        run: |
          lui_ref=$(sed -n 's/.*lui\.git#\([0-9a-f]\{40\}\).*/\1/p' deps/ui/scripts/install-opam-deps.sh | head -1)
          test -n "$lui_ref"
          git clone --no-checkout https://github.com/logseq/lui.git "$RUNNER_TEMP/lui"
          git -C "$RUNNER_TEMP/lui" checkout "$lui_ref"
          echo "commit=$(git -C "$RUNNER_TEMP/lui" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "LUI_SOURCE=$RUNNER_TEMP/lui" >> "$GITHUB_ENV"

      - name: Restore opam switch cache
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.opam
            _opam
          key: ${{ runner.os }}-opam-rlui-${{ env.OCAML_VERSION }}-${{ steps.lui.outputs.commit }}-${{ hashFiles('deps/db-worker/scripts/install-opam-deps.sh', 'deps/db-worker/dune-project', 'deps/ui/scripts/install-opam-deps.sh', 'deps/ui/dune-project') }}
          restore-keys: |
            ${{ runner.os }}-opam-rlui-${{ env.OCAML_VERSION }}-

      - name: Root pnpm deps
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      - name: opam deps (db-worker + ui)
        run: |
          (cd deps/db-worker && sh scripts/install-opam-deps.sh)
          (cd deps/ui && sh scripts/install-opam-deps.sh)
          opam install -y uri
          opam list --pinned

      - name: Save opam switch cache
        uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.opam
            _opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: JS deps (db-worker, ui, SDK)
        run: |
          pnpm --dir deps/db-worker install --ignore-workspace --frozen-lockfile
          pnpm --dir deps/ui install --ignore-workspace --frozen-lockfile
          pnpm --dir libs install --ignore-workspace --frozen-lockfile

      - name: QuickJS SDK contract
        run: |
          (cd libs && pnpm exec tsc --ignoreConfig --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022 src/LSPlugin.quickjs.ts src/LSPlugin.quickjs-entry.ts)
          sh deps/ui/scripts/check-quickjs-sdk.sh

      - name: Build Apple host
        run: bash deps/ui/apple/build.sh

      - name: Package Logseq.app
        run: bash deps/ui/apple/package.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: logseq-macos-arm64
          path: deps/ui/_build/packages/Logseq-macos-*.zip
          if-no-files-found: error
