name: Build self-hosted sync image

on:
  workflow_dispatch:
    inputs:
      logseq_ref:
        description: Logseq ref to build (branch, tag, or commit SHA)
        required: false
        default: master
      image_tag:
        description: Optional image tag
        required: false
        default: latest
  push:
    branches: [master]
    paths:
      - .github/workflows/build-selfhost-sync-image.yml
      - images/sync/Dockerfile
      - mise.toml
      - deps/db-sync/package.json

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/logseq-selfhost-sync

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/sync/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            LOGSEQ_REPO=https://github.com/${{ github.repository }}.git
            LOGSEQ_REF=${{ inputs.logseq_ref || github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'latest' }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
