name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'

env:
  CLOJURE_VERSION: '1.12.4.1618'
  JAVA_VERSION: '21'
  # This is the latest node version we can run.
  NODE_VERSION: '24'
  OCAML_VERSION: '5.5.1'
  BABASHKA_VERSION: '1.12.215'

jobs:
  typos:
    name: Spell Check with Typos
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v4
      - name: Check spelling with custom config file
        uses: crate-ci/typos@v1.16.8
        with:
          config: ./typos.toml

  test:
    strategy:
      matrix:
        operating-system: [ubuntu-22.04]

    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Babashka
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Fetch pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          dune-cache: true

      - name: Restore opam switch cache
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-${{ hashFiles('deps/db-worker/scripts/install-opam-deps.sh', 'deps/db-worker/*.opam', 'deps/ui/scripts/install-opam-deps.sh', 'deps/ui/*.opam', 'cli/*.opam') }}
          restore-keys: |
            ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-

      - name: Fetch db-worker OCaml deps
        working-directory: deps/db-worker
        run: |
          sh scripts/install-opam-deps.sh
          pnpm install

      - name: Build db-worker node bundle
        run: pnpm db-worker:build

      - name: Run db-worker OCaml tests
        working-directory: deps/db-worker
        run: |
          node scripts/check-schema-version.cjs
          node --test scripts/secret-kv-regression.cjs scripts/service-retry-regression.cjs
          node scripts/graph-storage-recovery.cjs
          node test/endpoint_lifecycle_probe.cjs
          opam exec -- dune runtest

      - name: Fetch UI OCaml deps
        working-directory: deps/ui
        run: sh scripts/install-opam-deps.sh

      - name: Save opam switch cache
        uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Build LUI app and publishing assets
        run: pnpm release

      - name: Run UI tests
        run: pnpm test:ui

      - name: Test OCaml translation validation
        run: node --test scripts/test-ui-i18n.mjs

      - name: Install publishing test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test publishing artifacts and LUI export
        run: pnpm test:publishing
        env:
          PLAYWRIGHT_CHANNEL: chromium

  cli-e2e:
    name: CLI E2E tests
    strategy:
      matrix:
        operating-system: [ubuntu-22.04]

    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            cli/pnpm-lock.yaml

      - name: Set up Babashka
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          dune-cache: true

      - name: Restore opam switch cache
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-${{ hashFiles('deps/db-worker/scripts/install-opam-deps.sh', 'deps/db-worker/*.opam', 'deps/ui/scripts/install-opam-deps.sh', 'deps/ui/*.opam', 'cli/*.opam') }}
          restore-keys: |
            ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-

      - name: Disable opam sandboxing
        run: |
          opam option --global 'wrap-build-commands=[]'
          opam option --global 'wrap-install-commands=[]'
          opam option --global 'wrap-remove-commands=[]'

      - name: Fetch OCaml deps
        working-directory: cli
        run: opam install . --deps-only --with-test --yes

      - name: Fetch db-worker OCaml deps
        working-directory: deps/db-worker
        run: |
          sh scripts/install-opam-deps.sh
          pnpm install

      - name: Save opam switch cache
        uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Fetch pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Fetch CLI pnpm deps
        run: pnpm --dir cli install --frozen-lockfile --ignore-workspace

      - name: Run CLI E2E tests
        run: opam exec -- bb dev:cli-e2e --jobs 1 --verbose

  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Babashka
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Validate shared resources
        run: bb lint:dev

  db-graph-test:
    strategy:
      matrix:
        operating-system: [ubuntu-latest]

    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            cli/pnpm-lock.yaml
            deps/db/pnpm-lock.yaml
            scripts/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          dune-cache: true

      - name: Restore opam switch cache
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-${{ hashFiles('deps/db-worker/scripts/install-opam-deps.sh', 'deps/db-worker/*.opam', 'deps/ui/scripts/install-opam-deps.sh', 'deps/ui/*.opam', 'cli/*.opam') }}
          restore-keys: |
            ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-

      - name: Install CLI Linux runtime deps
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0

      - name: Disable opam sandboxing
        run: |
          opam option --global 'wrap-build-commands=[]'
          opam option --global 'wrap-install-commands=[]'
          opam option --global 'wrap-remove-commands=[]'

      - name: Fetch OCaml deps
        working-directory: cli
        run: opam install . --deps-only --with-test --yes

      - name: Fetch db-worker OCaml deps
        working-directory: deps/db-worker
        run: |
          sh scripts/install-opam-deps.sh
          pnpm install

      - name: Save opam switch cache
        uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Fetch scripts pnpm deps
        run: pnpm --dir scripts install --frozen-lockfile --ignore-workspace

      - name: Fetch root pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Fetch CLI pnpm deps
        run: pnpm --dir cli install --frozen-lockfile --ignore-workspace

      - name: Create DB graph with properties
        run: cd scripts && pnpm exec nbb-logseq src/logseq/tasks/db_graph/create_graph_with_properties.cljs ./cli-root/graphs/properties-graph

      - name: Create DB graph with classes
        run: cd scripts && pnpm exec nbb-logseq src/logseq/tasks/db_graph/create_graph_with_schema_org.cljs ./cli-root/graphs/schema-graph

      - name: Fetch deps/db pnpm deps
        run: pnpm --dir deps/db install --frozen-lockfile --ignore-workspace

      - name: Fetch db-worker OCaml deps
        working-directory: deps/db-worker
        run: |
          sh scripts/install-opam-deps.sh
          pnpm install

      - name: Build logseq CLI runtime
        run: |
          opam exec -- pnpm cli:release
          pnpm db-worker-node:release:bundle
          pnpm --dir deps/db-sync build:node-adapter
          node scripts/prepare-cli-package.mjs
          pnpm --dir dist/cli-package install --prod --ignore-workspace
          pnpm --dir dist/cli-package pack --pack-destination ../

      - name: Smoke test packaged CLI
        run: node dist/cli-package/dist/logseq.js --version

      - name: Validate created DB graphs
        run: |
          node dist/cli-package/dist/logseq.js --root-dir scripts/cli-root --graph properties-graph --timeout-ms 3000 --profile --verbose graph validate
          node dist/cli-package/dist/logseq.js --root-dir scripts/cli-root --graph schema-graph --timeout-ms 120000 --profile --verbose graph validate

      - name: Print db-worker-node logs on graph validation failure
        if: failure()
        run: |
          find scripts/cli-root/graphs -maxdepth 2 -name 'db-worker-node-*.log' -print -exec tail -n 200 {} \; || true
          pgrep -af db-worker-node || true

      - name: Export a created DB graph
        run: node dist/cli-package/dist/logseq.js --root-dir scripts/cli-root --graph properties-graph --timeout-ms 3000 graph export --type edn --file scripts/properties.edn
      - name: Import an exported graph to confirm the export is working
        run: node dist/cli-package/dist/logseq.js --root-dir scripts/cli-root --graph properties-graph-roundtrip --timeout-ms 20000 graph import --type edn --input scripts/properties.edn
