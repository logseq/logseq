# REVIEW ONLY: not installed in .github/workflows and never dispatched.
name: Journal MATCH password recovery (one time)

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: journal-match-password-recovery-once
  cancel-in-progress: false

jobs:
  encrypt-only:
    if: >-
      ${{ github.repository == 'logseq/logseq' &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master' &&
          github.actor == 'RCmerci' &&
          github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      PRIMARY_FPR: 994AC8C9B8F2C4EB284A1F6F67A69367C23FC2EB
      ENCRYPTION_FPR: 14D85D5CD94C11F5A4E0EDD5075D0126ABFAF7B5
      RECIPIENT_PUBLIC_KEY: |
        -----BEGIN PGP PUBLIC KEY BLOCK-----
        
        mDMEateG5hYJKwYBBAHaRw8BAQdAQw1bNBQEtyj/sLtNPlKVjhRJPr8tVoSr4rpy
        LSrafBC0KkpvdXJuYWwgTUFUQ0ggcmVjb3ZlcnkgKHRhc2stMyAyMDI2LTEwLTIw
        KYi1BBMWCgBdFiEEmUrIybjyxOsoSh9vZ6aTZ8I/wusFAmrXhuYbFIAAAAAABAAO
        bWFudTIsMi41KzEuMTIsMCwzAhsBBQkACTqABQsJCAcCAiICBhUKCQgLAgQWAgMB
        Ah4HAheAAAoJEGemk2fCP8LrjtQBAKpcfAGPc8CyHdnOaKAGX7YF5hyZA1NXzgOr
        OwuXmz6zAQCGQOM9sCLC9DU9wOaAjXWXso1M7Fbv+VxZ1qiT3RXfArg4BGrXhvwS
        CisGAQQBl1UBBQEBB0BpDcqclPmdt9X1cYg3WTxCrOdf5juX3BT1231qZdRCHAMB
        CAeImgQYFgoAQhYhBJlKyMm48sTrKEofb2emk2fCP8LrBQJq14b8GxSAAAAAAAQA
        Dm1hbnUyLDIuNSsxLjEyLDAsMwIbDAUJAAk6gAAKCRBnppNnwj/C6xuwAP4pwlKb
        7T1ih4zcB7brdy5LygsOLaUIO6HAH6qEC9q2zwD+ILmRraOvZnG22g0Ke1VLxwo7
        3H3iZaZcez3EiMIuGw0=
        =DLhs
        -----END PGP PUBLIC KEY BLOCK-----
    steps:
      - name: Verify fixed recipient before accessing secret
        run: |
          set +x
          set -euo pipefail
          umask 077
          [[ "${RUNNER_DEBUG:-}" != "1" ]] || exit 1
          test -x /usr/bin/gpg
          key_root="$RUNNER_TEMP/journal-match-recovery"
          mkdir -m 700 "$key_root"
          mkdir -m 700 "$key_root/gnupg"
          printf '%s\n' "$RECIPIENT_PUBLIC_KEY" > "$key_root/recipient.asc"
          mapfile -t fingerprints < <(
            /usr/bin/gpg --no-options --batch --homedir "$key_root/gnupg" \
              --with-colons --with-subkey-fingerprint --show-keys "$key_root/recipient.asc" \
              2>/dev/null | awk -F: '$1 == "fpr" {print $10}'
          )
          [[ "${#fingerprints[@]}" == "2" ]]
          [[ "${fingerprints[0]}" == "$PRIMARY_FPR" ]]
          [[ "${fingerprints[1]}" == "$ENCRYPTION_FPR" ]]
          /usr/bin/gpg --no-options --batch --homedir "$key_root/gnupg" \
            --import "$key_root/recipient.asc" >/dev/null 2>&1

      - name: Encrypt only repository MATCH_PASSWORD via stdin
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          [[ -n "${MATCH_PASSWORD:-}" ]] || exit 1
          printf '%s' "$MATCH_PASSWORD" | \
            /usr/bin/gpg --no-options --batch --no-tty \
              --homedir "$RUNNER_TEMP/journal-match-recovery/gnupg" \
              --trust-model always --recipient "$ENCRYPTION_FPR!" \
              --compress-algo none --cipher-algo AES256 \
              --output "$RUNNER_TEMP/journal-match-recovery/match-password.gpg" --encrypt
          unset MATCH_PASSWORD
          test -s "$RUNNER_TEMP/journal-match-recovery/match-password.gpg"

      - name: Upload only ciphertext (one day)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # verified v7.0.2
        with:
          name: journal-match-password-${{ github.run_id }}
          path: ${{ runner.temp }}/journal-match-recovery/match-password.gpg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
