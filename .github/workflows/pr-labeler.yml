name: PR Labeler
on:
  pull_request_target:
    types: [opened]

jobs:
  pr-labeler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # actions/labeler reads the configuration from this repository (the base) and matches the head branch's name, so it
      # also labels pull requests from forks; TimonVS/pr-labeler-action read it at the head branch's name in this
      # repository, which a fork's branch does not have ("No commit found for the ref").
      - uses: actions/labeler@v6
        with:
          configuration-path: .github/pr-labeler.yml
