name: Deploy Any Branch to Cloudflare

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build & deploy"
        required: true
        default: "main"

env:
  NODE_VERSION: "24"
  OCAML_VERSION: '5.5.1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Install LUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpango1.0-dev libx11-dev libxext-dev

      - name: Install pinned SDL3
        run: |
          lui_ref=$(sed -n 's/.*lui\.git#\([0-9a-f]\{40\}\).*/\1/p' deps/ui/scripts/install-opam-deps.sh)
          test -n "$lui_ref"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/logseq/lui/$lui_ref/tooling/install_sdl3.py" \
            --output "$RUNNER_TEMP/install-sdl3.py"
          python3 "$RUNNER_TEMP/install-sdl3.py" "$RUNNER_TEMP/sdl3" --github-env

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          dune-cache: true

      - name: Restore opam switch cache
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-${{ github.job }}-${{ hashFiles('deps/db-worker/scripts/install-opam-deps.sh', 'deps/db-worker/*.opam', 'deps/ui/scripts/install-opam-deps.sh', 'deps/ui/*.opam', 'cli/*.opam') }}
          restore-keys: |
            ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-${{ github.job }}-

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Fetch OCaml deps
        working-directory: deps/db-worker
        run: sh scripts/install-opam-deps.sh

      - name: Install db-worker and UI pnpm deps
        run: |
          pnpm --dir deps/db-worker install --ignore-workspace --frozen-lockfile
          pnpm --dir deps/ui install --ignore-workspace --frozen-lockfile

      - name: Fetch ui OCaml deps
        working-directory: deps/ui
        run: sh scripts/install-opam-deps.sh

      - name: Save opam switch cache
        uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Set build environment flags
        run: |
          echo "ENABLE_FILE_SYNC_PRODUCTION=true" >> "$GITHUB_ENV"
          echo "ENABLE_RTC_SYNC_PRODUCTION=true" >> "$GITHUB_ENV"

      - name: Build web + workers
        run: |
          pnpm gulp:build
          pnpm ui:build --mode production
          pnpm db-worker:build

          rsync -avz \
            --exclude node_modules \
            --exclude android \
            --exclude ios \
            --exclude mobile \
            --exclude '*.map' \
            ./static/ ./public/

        env:
          LOGSEQ_POSTHOG_TOKEN: ${{ secrets.LOGSEQ_POSTHOG_TOKEN }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2553ea8236c11ea0f88de28fce1cbfee
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name logseq-any-branch --branch ${{ inputs.branch }}
