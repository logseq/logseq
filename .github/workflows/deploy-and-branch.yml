name: Deploy Any Branch to Cloudflare

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build & deploy"
        required: true
        default: "main"

env:
  NODE_VERSION: "24"
  OCAML_VERSION: '5.5.1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Install LUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpango1.0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev

      - name: Resolve pinned dependency revisions
        id: pins
        run: |
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          lui_ref=$(sed -n 's/.*lui\.git#\([0-9a-f]\{40\}\).*/\1/p' deps/ui/scripts/install-opam-deps.sh | head -1)
          test -n "$lui_ref"
          echo "lui-commit=$lui_ref" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/logseq/lui/$lui_ref/tooling/install_sdl3.py" \
            --output "$RUNNER_TEMP/install-sdl3.py"
          echo "sdl-script-sha=$(shasum -a 256 "$RUNNER_TEMP/install-sdl3.py" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

          pin_revisions="$RUNNER_TEMP/opam-pin-revisions"
          : > "$pin_revisions"
          grep -hEo 'git\+https://github\.com/[^"[:space:]]+#[^"[:space:]]+' \
            deps/db-worker/scripts/install-opam-deps.sh \
            deps/ui/scripts/install-opam-deps.sh | sort -u | while IFS= read -r pin; do
            repo_ref="${pin#git+https://github.com/}"
            repo="${repo_ref%%#*}"
            ref="${repo_ref##*#}"
            if [[ ! "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              continue
            fi
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$repo $ref $ref" >> "$pin_revisions"
              continue
            fi
            sha=$(git ls-remote "https://github.com/$repo" "refs/heads/$ref" | awk 'NR == 1 {print $1}')
            if [ -z "$sha" ]; then
              sha=$(git ls-remote "https://github.com/$repo" "refs/tags/$ref" | awk 'NR == 1 {print $1}')
            fi
            test -n "$sha"
            echo "$repo $ref $sha" >> "$pin_revisions"
          done
          sort -o "$pin_revisions" "$pin_revisions"
          cat "$pin_revisions"
          echo "fingerprint=$(shasum -a 256 "$pin_revisions" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "OPAM_PIN_LOCK=$pin_revisions" >> "$GITHUB_ENV"

      - name: Restore pinned SDL3 cache
        id: sdl3-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.sdl-script-sha }}

      - name: Configure SDL3 environment
        run: |
          echo "SDL3_LIBRARY=${{ runner.temp }}/sdl3/lib/libSDL3.so.0" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${{ runner.temp }}/sdl3/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${{ runner.temp }}/sdl3/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install pinned SDL3
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: python3 "$RUNNER_TEMP/install-sdl3.py" "$RUNNER_TEMP/sdl3"

      - name: Verify pinned SDL3
        run: test -f "$RUNNER_TEMP/sdl3/lib/libSDL3.so.0"

      - name: Save pinned SDL3 cache
        uses: actions/cache/save@v4
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/sdl3
          key: ${{ steps.sdl3-cache.outputs.cache-primary-key }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            deps/db-worker/pnpm-lock.yaml
            deps/ui/pnpm-lock.yaml

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Restore opam switch cache
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.opam
            _opam
          key: ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-${{ github.job }}-${{ steps.pins.outputs.lui-commit }}-${{ steps.pins.outputs.fingerprint }}-${{ hashFiles('deps/db-worker/scripts/install-opam-deps.sh', 'deps/db-worker/*.opam', 'deps/ui/scripts/install-opam-deps.sh', 'deps/ui/*.opam', 'cli/*.opam') }}
          restore-keys: |
            ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-${{ github.job }}-${{ steps.pins.outputs.lui-commit }}-
            ${{ runner.os }}-opam-${{ env.OCAML_VERSION }}-${{ github.job }}-

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      - name: Fetch OCaml deps
        if: steps.opam-cache.outputs.cache-hit != 'true'
        working-directory: deps/db-worker
        run: sh scripts/install-opam-deps.sh

      - name: Install db-worker and UI pnpm deps
        run: |
          pnpm --dir deps/db-worker install --ignore-workspace --frozen-lockfile
          pnpm --dir deps/ui install --ignore-workspace --frozen-lockfile

      - name: Fetch ui OCaml deps
        if: steps.opam-cache.outputs.cache-hit != 'true'
        working-directory: deps/ui
        run: sh scripts/install-opam-deps.sh

      - name: Prune opam cache artifacts
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: opam clean --all-switches --download-cache --logs --repo-cache --untracked --unused-repositories

      - name: Save opam switch cache
        uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.opam
            _opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Set build environment flags
        run: |
          echo "ENABLE_FILE_SYNC_PRODUCTION=true" >> "$GITHUB_ENV"
          echo "ENABLE_RTC_SYNC_PRODUCTION=true" >> "$GITHUB_ENV"

      - name: Restore incremental build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/db-worker/_build
            deps/ui/_build
          key: ${{ runner.os }}-${{ runner.arch }}-deploy-build-${{ env.OCAML_VERSION }}-${{ steps.pins.outputs.lui-commit }}-${{ steps.pins.outputs.fingerprint }}-${{ steps.pins.outputs.source-sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-deploy-build-${{ env.OCAML_VERSION }}-${{ steps.pins.outputs.lui-commit }}-${{ steps.pins.outputs.fingerprint }}-
            ${{ runner.os }}-${{ runner.arch }}-deploy-build-${{ env.OCAML_VERSION }}-

      - name: Build web + workers
        run: |
          pnpm gulp:build
          pnpm ui:build --mode production
          pnpm db-worker:build

          rsync -avz \
            --exclude node_modules \
            --exclude android \
            --exclude ios \
            --exclude mobile \
            --exclude '*.map' \
            ./static/ ./public/

        env:
          LOGSEQ_POSTHOG_TOKEN: ${{ secrets.LOGSEQ_POSTHOG_TOKEN }}

      - name: Save incremental build cache
        uses: actions/cache/save@v4
        if: steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            deps/db-worker/_build
            deps/ui/_build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2553ea8236c11ea0f88de28fce1cbfee
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name logseq-any-branch --branch ${{ inputs.branch }}
